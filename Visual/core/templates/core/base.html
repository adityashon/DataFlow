{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>{% block title %}DataFlow{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    {% block extra_head %}{% endblock %}

    {% block page_styles %}{% endblock %}
  </head>
  <body>
    <header>
      <a href="/" class="logo">
        <div class="logo-icon">📊</div>
        <div class="logo-name">Data<em>Flow</em></div>
      </a>
      <div class="header-right">
        {% block header_actions %}
        <span class="pill pill-sage">Made with sights</span>
        <span class="pill pill-clay">v1.0</span>
        <div class="pulse"></div>
        {% endblock %}
      </div>
    </header>

    <div class="container">{% block content %}{% endblock %}</div>

    {% block extra_js %}{% endblock %}
  </body>
</html>
